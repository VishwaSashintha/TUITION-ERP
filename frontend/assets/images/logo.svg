<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64" fill="none">
    <!-- Icon Mark -->
    <g transform="translate(4, 4)">
        <!-- Rounded Background Shield -->
        <rect width="56" height="56" rx="14" fill="#6C4EE3"/>
        <rect x="2" y="2" width="52" height="52" rx="12" fill="url(#brandGrad)" opacity="0.9"/>
        
        <!-- Open Book Pages -->
        <path d="M14 38C19 35 24 35 28 37C32 35 37 35 42 38V22C37 19 32 19 28 21C24 19 19 19 14 22V38Z" fill="#FFFFFF" fill-opacity="0.95"/>
        <line x1="28" y1="21" x2="28" y2="37" stroke="#6C4EE3" stroke-width="2" stroke-linecap="round"/>
        
        <!-- Graduation Cap (Mortarboard) -->
        <polygon points="28,12 43,18 28,24 13,18" fill="#FF7A59"/>
        <path d="M21 21.5V28C21 30.5 24.5 32 28 32C31.5 32 35 30.5 35 28V21.5" fill="#FF7A59" opacity="0.9"/>
        <path d="M43 18V26" stroke="#FF7A59" stroke-width="2" stroke-linecap="round"/>
        <circle cx="43" cy="27" r="1.5" fill="#FF7A59"/>
    </g>

    <!-- Typography -->
    <text x="70" y="34" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#1E1B4B" letter-spacing="-0.5">
        Tuition<tspan fill="#6C4EE3">Pro</tspan>
    </text>
    <text x="71" y="48" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#6B7280" letter-spacing="1.5">
        INSTITUTE ERP
    </text>

    <!-- Gradient Definition -->
    <defs>
        <linearGradient id="brandGrad" x1="0" y1="0" x2="56" y2="56" gradientUnits="userSpaceOnUse">
            <stop stop-color="#6C4EE3"/>
            <stop offset="1" stop-color="#5638C4"/>
        </linearGradient>
    </defs>
</svg>

